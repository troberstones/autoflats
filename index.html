<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>autoFlats</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  /* dvh, not vh: on iPad Safari 100vh counts the area behind the browser chrome,
     so the bottom control bar sat below the fold and could not be reached. */
  body { font: clamp(11px, 1.05vw, 13px) system-ui, sans-serif; background: #222; color: #ddd;
         height: 100vh; height: 100dvh; overflow: hidden;
         display: grid; grid-template-rows: auto 1fr auto;
         grid-template-columns: 44px minmax(0, 1fr) clamp(150px, 19vw, 240px);
         grid-template-areas: "menu menu menu" "tools canvas layers" "ctrl ctrl ctrl"; }
  #menu { grid-area: menu; display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 10px; background: #2c2c2c; align-items: center; border-bottom: 1px solid #111; }
  #tools { grid-area: tools; display: flex; flex-direction: column; gap: 4px; padding: 6px 4px; background: #2c2c2c; border-right: 1px solid #111; }
  #wrap { grid-area: canvas; position: relative; overflow: hidden; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #layers { grid-area: layers; overflow-y: auto; background: #2c2c2c; border-left: 1px solid #111; padding: 4px; }
  /* The bar wraps to as many rows as it needs, but never takes more than a third
     of the window -- past that it scrolls, so the canvas is never squeezed out. */
  #ctrl { grid-area: ctrl; display: flex; flex-direction: column; gap: 4px; padding: 6px 10px; background: #2c2c2c;
          border-top: 1px solid #111; align-items: stretch;
          max-height: 34dvh; overflow-y: auto; overscroll-behavior: contain; }
  .bar { display: flex; gap: clamp(6px, 1vw, 14px); align-items: center; flex-wrap: wrap; }
  #adv { border-top: 1px dashed #444; padding-top: 5px; }
  #adv[hidden] { display: none; }
  button.link { background: none; border: none; color: #8bf; padding: 4px 2px; }
  button.link:hover { background: none; text-decoration: underline; }
  button { background: #444; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: #505050; }
  button:disabled { opacity: .4; cursor: default; }
  button.active { background: #2a6cd4; border-color: #2a6cd4; color: #fff; }
  /* The 1994 toolbox: a grey face with a light bevel top-left and a dark one
     bottom-right, going the other way when pressed. Square corners on purpose
     -- a rounded button is the wrong decade, and the icons are drawn on a
     16x16 grid that only lines up on a flat face. */
  #tools button { padding: 3px; font-size: 0; line-height: 0; border-radius: 0;
                  background: #c0c0c0; border: 1px solid #000;
                  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #808080;
                  display: flex; align-items: center; justify-content: center; }
  #tools button:hover { background: #d0d0d0; }
  #tools button.active { background: #a0a0a0;
                         box-shadow: inset 1px 1px 0 #707070, inset -1px -1px 0 #e0e0e0; }
  /* The icons paint in currentColor, so the button owns the ink -- black on the
     grey face, and still black when it is pressed. */
  #tools button svg { display: block; width: 100%; height: auto; max-width: 22px; color: #000; }
  label.s { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  input[type=range] { width: clamp(52px, 6.5vw, 90px); }
  /* Touch targets: a finger needs more than a 4px-tall slider thumb. */
  @media (pointer: coarse) {
    button { padding: 7px 12px; }
    input[type=range] { height: 24px; }
    .row { padding: 6px 4px; }
  }
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
  .row:hover { background: #383838; }
  .row.sel { background: #2a4a74; }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .ar { color: #888; font-size: 11px; }
  .row input[type=color] { width: 22px; height: 22px; padding: 0; border: none; background: none; }
  .row.grp { background: #333; margin-top: 2px; }
  .row.grp:hover { background: #3d3d3d; }
  .row.kid { padding-left: 18px; }
  .tw { width: 10px; color: #999; font-size: 9px; user-select: none; }
  .phead { display: flex; gap: 6px; align-items: center; padding: 2px 4px 6px; border-bottom: 1px solid #383838; margin-bottom: 4px; }
  .phead select { flex: 1; min-width: 0; background: #3a3a3a; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 2px; }
  input.ren { flex: 1; min-width: 0; background: #1c1c1c; color: #fff; border: 1px solid #2a6cd4; border-radius: 3px; padding: 1px 3px; font: inherit; }
  #status { margin-left: auto; color: #999; }
  #badge { color: #ffa030; display: none; }
  .hint { color: #888; font-size: 11px; }
  .hint a { color: #7a9ec2; }
  label.s.off { opacity: .45; }
  .spin { color: #6cf; }
  #pal { display: inline-flex; gap: 3px; flex-wrap: wrap; max-width: 40vw; }
  #pal i { width: 18px; height: 18px; border-radius: 3px; border: 1px solid #0006; cursor: pointer; display: block; }
  #pal i.cur { outline: 2px solid #fff; outline-offset: 1px; }
  /* Floating panels. Anchored under the menu on the right, over the layers
     list: they are transient editors, and the alternative -- another permanent
     bar -- is what the Advanced disclosure already exists to avoid. */
  .pop { position: fixed; top: 42px; right: 8px; z-index: 40; width: clamp(220px, 26vw, 300px);
         background: #2b2b2b; border: 1px solid #555; border-radius: 6px; padding: 8px;
         box-shadow: 0 8px 28px #000a; display: flex; flex-direction: column; gap: 6px;
         max-height: calc(100dvh - 56px); overflow-y: auto; overscroll-behavior: contain; }
  .pop[hidden] { display: none; }
  .pop h4 { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: #9ab;
            display: flex; align-items: center; gap: 6px; }
  .pop h4 button { margin-left: auto; }
  .pop .prow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pop label.s { justify-content: space-between; }
  .pop input[type=range] { width: 110px; }
  .pop input[type=number] { width: 62px; background: #1c1c1c; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: 2px 4px; font: inherit; }
  #palGrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
  /* touch-action + no callout: a press-and-hold on iPad must reach us as a
     long press, not as the OS text-selection magnifier or a share sheet. */
  #palGrid i { aspect-ratio: 1; border-radius: 3px; border: 1px solid #0006; cursor: pointer; display: block; position: relative;
               touch-action: manipulation; user-select: none; -webkit-touch-callout: none; }
  #palSliders { display: grid; gap: 1px; }
  #palSliders label.s { gap: 4px; }
  #palSliders input[type=range] { flex: 1; width: auto; min-width: 0; }
  #palSliders span { width: 34px; text-align: right; }
  /* An empty slot has to read as "click me", not as a black swatch. */
  #palGrid i.mt { background: repeating-linear-gradient(45deg, #333 0 4px, #3a3a3a 4px 8px); border-style: dashed; border-color: #666; }
  #palGrid i.cur { outline: 2px solid #fff; outline-offset: 1px; }
  #refWrap { position: relative; border: 1px dashed #666; border-radius: 4px; min-height: 96px;
             display: flex; align-items: center; justify-content: center; overflow: hidden; background: #242424; }
  #refWrap.has { border-style: solid; cursor: crosshair; }
  #refCv { max-width: 100%; display: block; }
  /* An empty canvas is still a flex item, and it squeezed the hint into a
     one-character-wide column down the right edge. */
  #refWrap:not(.has) #refCv { display: none; }
  #refWrap.has #refHint { display: none; }
  #refHint { color: #888; font-size: 11px; text-align: center; padding: 8px; }
  /* pointer-events:none so the overlay can never eat the drag it is advertising */
  #dropzone { position: fixed; inset: 0; z-index: 50; display: none; pointer-events: none;
              align-items: center; justify-content: center; background: rgba(20,30,45,.82);
              border: 4px dashed #6cf; font-size: 20px; color: #cfe8ff; }
</style>
</head>
<body>
  <div id="menu">
    <button id="bOpen">Open…</button>
    <button id="bFlat" disabled>Auto Flat</button>
    <button id="bGaps" disabled>Suggest Gaps</button>
    <button id="bAcceptAll" disabled>Accept All Gaps</button>
    <button id="bReflat" disabled>Re-Flat</button>
    <button id="bCluster" disabled title="Merge small fills into the neighbor they share an un-inked border with">Cluster Small</button>
    <span id="badge">● changes need Re-Flat</span>
    <button id="bExport" disabled>Export PSD</button>
    <select id="expMode" title="How fills become PSD layers">
      <option value="color" selected>one layer per color</option>
      <option value="region">one layer per fill</option>
      <option value="flat">single flat layer</option>
    </select>
    <label class="s" title="Render the fills as watercolor washes instead of flat colour: pigment pooling darker at every edge, paper grain, and uneven blooms across the wash. Shown on the canvas and written into the PSD, one wash per fill, so a region can still be restyled on its own in Photoshop."><input type="checkbox" id="cWater"> Watercolor</label>
    <button id="bWcPanel" class="link" title="Watercolor settings">⋯</button>
    <label class="s">Fill color <input type="color" id="curColor" value="#c8e0f0"></label>
    <label class="s" title="Bucket picks a random color per fill"><input type="checkbox" id="cRand"> Random</label>
    <span id="pal" title="Swatches. Click one to make it the current color; ⌥-click or right-click removes it."></span>
    <button id="bPalAdd" class="link" title="Add the current fill color to the palette">+</button>
    <button id="bPalPanel" class="link" title="Open the palette editor">⋯</button>
    <span id="status">Open a line-art image to begin</span>
  </div>
  <div id="tools">
    <button id="tPan"     title="Pan (V / hold Space)"></button>
    <button id="tFill"    title="Fill / recolor region (B). Click background to carve a new fill. Alt-click: pick color"></button>
    <button id="tBarrier" title="Barrier pen (G): draw invisible gap-closing lines"></button>
    <button id="tEraser"  title="Barrier eraser (E)"></button>
    <button id="tMerge"   title="Merge regions (M): click one region, then click the region to merge into it — a rubber band follows the cursor in between. Esc, right-click or a click off the canvas cancels. Remembered as the two points you clicked, so it survives re-flatting; shown in green with the Edits overlay and removable with ⬚."></button>
    <button id="tDraw"    title="Draw merge (D): stroke from a fill — every fill the stroke crosses merges into it"></button>
    <button id="tDel"     title="Delete fill (X): click a fill to remove it — it stops rendering and is left out of the PSD. Survives re-flatting; ⌘Z restores"></button>
    <button id="tGroup"   title="Group fills (R): lasso around or a stroke through a set of fills — they export as a PSD folder and the group survives re-flatting"></button>
    <button id="tShape"  title="Shape fill (F): draw a closed shape and it becomes a fill in the current color, on top of whatever was there. Remembered as the shape you drew, so it survives re-flatting."></button>
    <button id="tRecolor" title="Recolor (C): click a fill to paint it the current palette color. Never carves a new fill out of the background the way the bucket does, so it is safe to sweep across a finished flat. Shift-click recolors every fill that shares that color; ⌥-click picks the color up instead."></button>
    <button id="tPick"    title="Select edits (S): click a remembered edit — a draw-merge stroke, a ✖ delete marker or a group lasso — or drag a box around several. Shift-click adds. Delete removes them. Turns on the Edits overlay."></button>
  </div>
  <div id="wrap"><canvas id="view"></canvas></div>
  <div id="layers"></div>
  <div id="ctrl">
    <div class="bar">
      <label class="s">Line threshold <input type="range" id="sThr" min="5" max="90" value="5"><span id="vThr">5%</span></label>
      <label class="s">Smoothing <input type="range" id="sSm" min="0" max="4" value="1"><span id="vSm">1px</span></label>
      <label class="s" id="lMin">Min region <input type="range" id="sMin" min="0" max="500" value="0"><span id="vMin">0px²</span></label>
      <label class="s" title="Assign fills from a palette of this many colors, so neighbouring fills never share one. Groups the layers panel and enables one-layer-per-color export. 0 = a unique color per fill.">Colors <input type="range" id="sPal" min="0" max="32" value="0"><span id="vPal">unique</span></label>
      <label class="s" title="Segment by hanging the drawing like a rubber sheet and taking the sagging valleys as fills, instead of rolling a ball. Higher = only deeper valleys count as their own fill. 0 = off (trapped ball).">Rubber sheet <input type="range" id="sSag" min="0" max="30" value="2"><span id="vSag">2px</span></label>
      <label class="s" title="Before segmenting, seal the breaks that are past arguing about: two open stroke ends within reach of each other, facing each other head-on, with nothing but blank paper between them. Each gets a 1px invisible bridge, so an area the artist meant to close is already closed when the rubber sheet arrives — which puts the boundary on the drawn line instead of on a crease inside the shape. Never exported. Closed gaps are drawn in green with the Edits overlay."><input type="checkbox" id="cHybrid" checked> Close tight gaps</label>
      <label class="s" title="Re-flat automatically after tuning a parameter"><input type="checkbox" id="cAuto" checked> Auto re-flat</label>
      <label class="s">Line opacity <input type="range" id="sOp" min="0" max="100" value="100"></label>
      <label class="s" title="Draw the edits that are remembered and replayed after every re-flat: draw-merge strokes (green), deleted-fill markers (red ✖) and group lassos (yellow). Pick and remove them with the ⬚ tool."><input type="checkbox" id="cEdits"> Edits</label>
      <label class="s" title="Outline the watershed ridges between fills. White where the ridge lies on ink (the artist drew that boundary); cyan where it crosses blank paper — a gap that got closed with nothing drawn across it."><input type="checkbox" id="cRidge"> Ridges</label>
      <button id="bUndo" disabled>Undo ⌘Z</button>
      <button id="bAdv" class="link" aria-expanded="false" title="Show the tuning controls that most drawings never need">Advanced ▸</button>
    </div>
    <div class="bar" id="adv" hidden>
      <label class="s">Color reject <input type="range" id="sSat" min="5" max="100" value="30"><span id="vSat">30%</span></label>
      <label class="s" title="Erode lines to a 1px skeleton before filling, so gap size &amp; matching ignore stroke thickness"><input type="checkbox" id="cSkel"> Skeletonize</label>
      <label class="s">Gap size <input type="range" id="sGap" min="1" max="32" value="8"><span id="vGap">8px</span></label>
      <label class="s" id="lSliv" title="Merge fills thinner than this everywhere — the space between parallel/double strokes. 0 = off">Sliver width <input type="range" id="sSliv" min="0" max="8" value="3"><span id="vSliv">3px</span></label>
      <label class="s" id="lDecl" title="Absorb small fills squeezed between strokes in busy line work (hatching, texture, folds) into the area they shade. Higher = more aggressive. 0 = off">Declutter <input type="range" id="sDecl" min="0" max="100" value="50"><span id="vDecl">50</span></label>
      <label class="s" id="lMerge" title="Merge fill fragments whose shared border crosses open space against the stroke flow"><input type="checkbox" id="cMerge" checked> Auto-merge leaks</label>
      <label class="s" title="Rank gap bridges by a stochastic completion field (Williams &amp; Jacobs): tips link only where the field diffuses a smooth connecting contour between them. Used by Suggest Gaps."><input type="checkbox" id="cField"> Completion field</label>
      <label class="s" title="Automatically bridge suggested gaps after flatting. Each suggestion is already proven to close a fill, so this is safe to leave on; ⌘Z undoes a round."><input type="checkbox" id="cBridge"> Auto-bridge gaps</label>
      <label class="s" id="lGpu" title="Run the growth stages on the GPU (WebGPU); falls back to CPU automatically" hidden><input type="checkbox" id="cGpu" checked> GPU</label>
      <label class="s"><input type="checkbox" id="cLines"> Show extracted lines</label>
      <label class="s" id="lSagView" title="Show the rubber sheet itself: black where it is pinned to the ink, brightening as it sags. Needs the Rubber sheet slider to be up."><input type="checkbox" id="cSagView"> Sag field <span id="vSagView" class="hint"></span></label>
      <label class="s" id="lZebra" title="Cut the sag field into this many flat bands, like contour lines on a map — every stripe is one step of roominess, so tight stripes mean the sheet is falling away fast and a wide stripe is a plateau. Alternate bands are dimmed so neighbours never blend. Bands are evenly spaced on the same log scale as the ramp. 0 = smooth ramp.">Zebra <input type="range" id="sZebra" min="0" max="32" value="0"><span id="vZebra">off</span></label>
      <!-- Streamline Pixel is CC BY 4.0, which asks for credit where the work
           is used. Here rather than in the main bar: visible to anyone who
           looks, without a licence notice sitting over the artwork. -->
      <span class="hint">Tool icons: <a href="https://pixelarticons.com" target="_blank" rel="noopener">Pixelarticons</a> (MIT) and
        <a href="https://icon-sets.iconify.design/streamline-pixel/" target="_blank" rel="noopener">Streamline Pixel</a>
        (<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>)</span>
    </div>
  </div>
  <div id="wcPanel" class="pop" hidden>
    <h4>Watercolor <button class="link" id="bWcClose">✕</button></h4>
    <label class="s" title="Show the wash on the canvas as well as in the export. Costs one pass over the image whenever the fills change shape; recolouring stays instant either way.">Preview on canvas <input type="checkbox" id="cWcPrev" checked></label>
    <label class="s" title="How much darker the pigment dries where the water stopped. This is the term that reads as 'painted' more than any other — a wash with no rim looks like flat colour with noise on it.">Pooling <input type="range" id="sWcPool" min="0" max="60" value="24"><span id="vWcPool" class="hint">0.24</span></label>
    <label class="s" title="The tooth of the paper: high-frequency break-up across the whole wash. Also sets how much grain the white paper layer under the fills gets.">Paper grain <input type="range" id="sWcGrain" min="0" max="40" value="10"><span id="vWcGrain" class="hint">0.10</span></label>
    <label class="s" title="Low-frequency unevenness — the patches where a wash dried heavier or lighter across a wide area.">Blooms <input type="range" id="sWcBloom" min="0" max="50" value="16"><span id="vWcBloom" class="hint">0.16</span></label>
    <label class="s" title="How many watercolor layers to write before asking. A watercolor layer is a full-size textured image rather than a slab of one colour, so a few dozen is a normal PSD and a few hundred is a file Photoshop may not open. Past this you get a warning and the choice; switching export to one-layer-per-color is usually the better answer.">Max layers <input type="number" id="nWcMax" min="1" max="9999" value="30"></label>
    <div class="prow"><button class="link" id="bWcReset">reset</button></div>
  </div>

  <div id="palPanel" class="pop" hidden>
    <h4>Palette <button class="link" id="bPalClose">✕</button></h4>
    <div id="palGrid" title="Click an empty slot to drop the current color into it. Click a filled one to make it current. To empty one: ⌥-click, right-click, or press and hold."></div>
    <div class="hint" id="palHint">⌥-click, right-click or press-and-hold a swatch to empty it</div>
    <div id="palSliders">
      <label class="s">R <input type="range" id="sPR" min="0" max="255" value="0"><span id="vPR" class="hint">0</span></label>
      <label class="s">G <input type="range" id="sPG" min="0" max="255" value="0"><span id="vPG" class="hint">0</span></label>
      <label class="s">B <input type="range" id="sPB" min="0" max="255" value="0"><span id="vPB" class="hint">0</span></label>
      <label class="s">H <input type="range" id="sPH" min="0" max="360" value="0"><span id="vPH" class="hint">0°</span></label>
      <label class="s">S <input type="range" id="sPS" min="0" max="100" value="0"><span id="vPS" class="hint">0%</span></label>
      <label class="s">L <input type="range" id="sPL" min="0" max="100" value="0"><span id="vPL" class="hint">0%</span></label>
    </div>
    <div class="prow">
      <button class="link" id="bPalPull" title="Replace the palette with the colors already used by the fills, largest area first">from fills</button>
      <button class="link" id="bPalSave" title="Download this palette as a .json file">download</button>
      <button class="link" id="bPalLoad" title="Load a palette — .json from here, or any file with #rrggbb colors in it, such as a GIMP/Krita .gpl">upload</button>
      <button class="link" id="bPalClear" title="Empty every slot">clear</button>
    </div>
    <div id="refWrap" title="Reference image: click or drag on it to pick a color.">
      <canvas id="refCv"></canvas>
      <span id="refHint">Paste an image (⌘V) or drop one here, then click it to pick colors</span>
    </div>
  </div>
  <input type="file" id="palFile" accept=".json,.gpl,.txt,.hex,application/json,text/plain" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0">

  <!-- visually hidden rather than display:none: Safari will not open the file
       picker for a hidden input when .click() is called from script -->
  <div id="dropzone">Drop line art to open</div>
  <input type="file" id="file" accept="image/*" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0">
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
