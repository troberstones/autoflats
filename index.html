<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>autoFlats</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { font: 13px system-ui, sans-serif; background: #222; color: #ddd; height: 100vh;
         display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 44px 1fr 240px;
         grid-template-areas: "menu menu menu" "tools canvas layers" "ctrl ctrl ctrl"; }
  #menu { grid-area: menu; display: flex; gap: 6px; padding: 6px 10px; background: #2c2c2c; align-items: center; border-bottom: 1px solid #111; }
  #tools { grid-area: tools; display: flex; flex-direction: column; gap: 4px; padding: 6px 4px; background: #2c2c2c; border-right: 1px solid #111; }
  #wrap { grid-area: canvas; position: relative; overflow: hidden; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #layers { grid-area: layers; overflow-y: auto; background: #2c2c2c; border-left: 1px solid #111; padding: 4px; }
  #ctrl { grid-area: ctrl; display: flex; gap: 14px; padding: 6px 10px; background: #2c2c2c; border-top: 1px solid #111; align-items: center; flex-wrap: wrap; }
  button { background: #444; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: #505050; }
  button:disabled { opacity: .4; cursor: default; }
  button.active { background: #2a6cd4; border-color: #2a6cd4; color: #fff; }
  #tools button { padding: 8px 0; font-size: 15px; }
  label.s { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  input[type=range] { width: 90px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
  .row:hover { background: #383838; }
  .row.sel { background: #2a4a74; }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .ar { color: #888; font-size: 11px; }
  .row input[type=color] { width: 22px; height: 22px; padding: 0; border: none; background: none; }
  .row.grp { background: #333; margin-top: 2px; }
  .row.grp:hover { background: #3d3d3d; }
  .row.kid { padding-left: 18px; }
  .tw { width: 10px; color: #999; font-size: 9px; user-select: none; }
  #status { margin-left: auto; color: #999; }
  #badge { color: #ffa030; display: none; }
  .hint { color: #888; font-size: 11px; }
  label.s.off { opacity: .45; }
  .spin { color: #6cf; }
  /* pointer-events:none so the overlay can never eat the drag it is advertising */
  #dropzone { position: fixed; inset: 0; z-index: 50; display: none; pointer-events: none;
              align-items: center; justify-content: center; background: rgba(20,30,45,.82);
              border: 4px dashed #6cf; font-size: 20px; color: #cfe8ff; }
</style>
</head>
<body>
  <div id="menu">
    <button id="bOpen">Open…</button>
    <button id="bFlat" disabled>Auto Flat</button>
    <button id="bGaps" disabled>Suggest Gaps</button>
    <button id="bAcceptAll" disabled>Accept All Gaps</button>
    <button id="bReflat" disabled>Re-Flat</button>
    <button id="bCluster" disabled title="Merge small fills into the neighbor they share an un-inked border with">Cluster Small</button>
    <span id="badge">● changes need Re-Flat</span>
    <button id="bExport" disabled>Export PSD</button>
    <select id="expMode" title="How fills become PSD layers">
      <option value="color">one layer per color</option>
      <option value="region" selected>one layer per fill</option>
      <option value="flat">single flat layer</option>
    </select>
    <label class="s">Fill color <input type="color" id="curColor" value="#c8e0f0"></label>
    <label class="s" title="Bucket picks a random color per fill"><input type="checkbox" id="cRand"> Random</label>
    <span id="status">Open a line-art image to begin</span>
  </div>
  <div id="tools">
    <button id="tPan"     title="Pan (V / hold Space)">✋</button>
    <button id="tFill"    title="Fill / recolor region (B). Click background to carve a new fill. Alt-click: pick color">🪣</button>
    <button id="tBarrier" title="Barrier pen (G): draw invisible gap-closing lines">🖊</button>
    <button id="tEraser"  title="Barrier eraser (E)">🧽</button>
    <button id="tMerge"   title="Merge regions (M): click two regions">⧉</button>
    <button id="tDraw"    title="Draw merge (D): stroke from a fill — every fill the stroke crosses merges into it">🧲</button>
    <button id="tDel"     title="Delete fill (X): click a fill to remove it — it stops rendering and is left out of the PSD. Survives re-flatting; ⌘Z restores">🗑</button>
    <button id="tGroup"   title="Group fills (R): lasso around or a stroke through a set of fills — they export as a PSD folder and the group survives re-flatting">🔗</button>
    <button id="tPick"    title="Select edits (S): click a remembered edit — a draw-merge stroke, a ✖ delete marker or a group lasso — or drag a box around several. Shift-click adds. Delete removes them. Turns on the Edits overlay.">⬚</button>
  </div>
  <div id="wrap"><canvas id="view"></canvas></div>
  <div id="layers"></div>
  <div id="ctrl">
    <label class="s">Line threshold <input type="range" id="sThr" min="5" max="90" value="25"><span id="vThr">25%</span></label>
    <label class="s">Color reject <input type="range" id="sSat" min="5" max="100" value="30"><span id="vSat">30%</span></label>
    <label class="s">Smoothing <input type="range" id="sSm" min="0" max="4" value="1"><span id="vSm">1px</span></label>
    <label class="s" title="Erode lines to a 1px skeleton before filling, so gap size &amp; matching ignore stroke thickness"><input type="checkbox" id="cSkel"> Skeletonize</label>
    <label class="s">Gap size <input type="range" id="sGap" min="1" max="32" value="8"><span id="vGap">8px</span></label>
    <label class="s">Min region <input type="range" id="sMin" min="0" max="500" value="150"><span id="vMin">150px²</span></label>
    <label class="s" title="Assign fills from a palette of this many colors, so neighbouring fills never share one. Groups the layers panel and enables one-layer-per-color export. 0 = a unique color per fill.">Colors <input type="range" id="sPal" min="0" max="32" value="0"><span id="vPal">unique</span></label>
    <label class="s" title="Segment by hanging the drawing like a rubber sheet and taking the sagging valleys as fills, instead of rolling a ball. Higher = only deeper valleys count as their own fill. 0 = off (trapped ball).">Rubber sheet <input type="range" id="sSag" min="0" max="30" value="0"><span id="vSag">off</span></label>
    <label class="s" id="lSliv" title="Merge fills thinner than this everywhere — the space between parallel/double strokes. 0 = off">Sliver width <input type="range" id="sSliv" min="0" max="8" value="3"><span id="vSliv">3px</span></label>
    <label class="s" title="Absorb small fills squeezed between strokes in busy line work (hatching, texture, folds) into the area they shade. Higher = more aggressive. 0 = off">Declutter <input type="range" id="sDecl" min="0" max="100" value="50"><span id="vDecl">50</span></label>
    <label class="s" id="lMerge" title="Merge fill fragments whose shared border crosses open space against the stroke flow"><input type="checkbox" id="cMerge" checked> Auto-merge leaks</label>
    <label class="s" title="Rank gap bridges by a stochastic completion field (Williams &amp; Jacobs): tips link only where the field diffuses a smooth connecting contour between them. Used by Suggest Gaps."><input type="checkbox" id="cField"> Completion field</label>
    <label class="s" title="Re-flat automatically after tuning a parameter"><input type="checkbox" id="cAuto"> Auto re-flat</label>
    <label class="s" title="Automatically bridge suggested gaps after flatting. Each suggestion is already proven to close a fill, so this is safe to leave on; ⌘Z undoes a round."><input type="checkbox" id="cBridge"> Auto-bridge gaps</label>
    <label class="s" id="lGpu" title="Run the growth stages on the GPU (WebGPU); falls back to CPU automatically" hidden><input type="checkbox" id="cGpu" checked> GPU</label>
    <label class="s">Line opacity <input type="range" id="sOp" min="0" max="100" value="100"></label>
    <label class="s"><input type="checkbox" id="cLines"> Show extracted lines</label>
    <label class="s" id="lSagView" title="Show the rubber sheet itself: black where it is pinned to the ink, brightening as it sags. Needs the Rubber sheet slider to be up."><input type="checkbox" id="cSagView"> Sag field <span id="vSagView" class="hint"></span></label>
    <label class="s" id="lZebra" title="Cut the sag field into this many flat bands, like contour lines on a map — every stripe is one step of roominess, so tight stripes mean the sheet is falling away fast and a wide stripe is a plateau. Alternate bands are dimmed so neighbours never blend. Bands are evenly spaced on the same log scale as the ramp. 0 = smooth ramp.">Zebra <input type="range" id="sZebra" min="0" max="32" value="0"><span id="vZebra">off</span></label>
    <label class="s" title="Draw the edits that are remembered and replayed after every re-flat: draw-merge strokes (green), deleted-fill markers (red ✖) and group lassos (yellow). Pick and remove them with the ⬚ tool."><input type="checkbox" id="cEdits"> Edits</label>
    <label class="s" title="Outline the watershed ridges between fills. White where the ridge lies on ink (the artist drew that boundary); cyan where it crosses blank paper — a gap that got closed with nothing drawn across it."><input type="checkbox" id="cRidge"> Ridges</label>
    <button id="bUndo" disabled>Undo ⌘Z</button>
  </div>
  <!-- visually hidden rather than display:none: Safari will not open the file
       picker for a hidden input when .click() is called from script -->
  <div id="dropzone">Drop line art to open</div>
  <input type="file" id="file" accept="image/*" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0">
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
